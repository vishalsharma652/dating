<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saathika Admin Panel</title>
    <link rel="icon" type="image/jpeg" href="./logo.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              adminBg: '#07070c',
              adminPanel: 'rgba(18, 18, 33, 0.65)',
              adminPanel2: 'rgba(26, 26, 46, 0.85)',
              adminBorder: 'rgba(255, 255, 255, 0.08)',
              adminBorderHover: 'rgba(255, 255, 255, 0.16)',
              adminText: '#f8fafc',
              adminMuted: '#94a3b8',
              adminPrimary: '#818cf8',
              adminSuccess: '#10b981',
              adminWarning: '#f59e0b',
              adminDanger: '#f43f5e',
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@400;500;700&display=swap');

      :root {
        --bg: #0b1020;
        --panel: rgba(13, 20, 38, 0.7);
        --panel-2: rgba(22, 32, 60, 0.85);
        --border: rgba(255, 255, 255, 0.04);
        --border-hover: rgba(255, 255, 255, 0.08);
        --text: #f8fafc;
        --muted: #64748b;
        --primary: #7c5cff;
        --primary-rgb: 124, 92, 255;
        --primary-gradient: linear-gradient(135deg, #7c5cff 0%, #4f8cff 100%);
        --success: #2de2e6;
        --success-rgb: 45, 226, 230;
        --warning: #f59e0b;
        --danger: #f43f5e;
        --card-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background-color: var(--bg);
        background-image: 
          radial-gradient(at 10% 10%, rgba(124, 92, 255, 0.16) 0px, transparent 45%),
          radial-gradient(at 90% 90%, rgba(45, 226, 230, 0.1) 0px, transparent 45%),
          radial-gradient(at 50% 50%, rgba(79, 140, 255, 0.06) 0px, transparent 50%);
        color: var(--text);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        letter-spacing: -0.01em;
        overflow-x: hidden;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.02);
        border-radius: 99px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 99px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(129, 140, 248, 0.6);
        border: 2px solid transparent;
        background-clip: padding-box;
      }

      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: 0.65; }

      .login-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        position: relative;
      }
      .login-page::before {
        content: '';
        position: absolute;
        width: 300px;
        height: 300px;
        background: rgba(99, 102, 241, 0.15);
        filter: blur(80px);
        border-radius: 50%;
        top: 25%;
        left: 25%;
        pointer-events: none;
      }

      .login-card {
        width: 100%;
        max-width: 420px;
        padding: 36px;
        border: 1px solid var(--border);
        background: rgba(18, 18, 33, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 20px;
        box-shadow: var(--card-shadow);
      }

      .eyebrow {
        color: #818cf8;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.25em;
        text-transform: uppercase;
      }
      h1, h2, h3, p { margin: 0; }
      h1 { 
        margin-top: 10px; 
        font-size: 28px; 
        font-weight: 800;
        letter-spacing: -0.03em;
        background: linear-gradient(135deg, #ffffff 40%, #c7d2fe 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      h2 {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      h3 {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .muted { color: var(--muted); }

      .field { display: grid; gap: 8px; margin-top: 20px; }
      .field span { color: #cbd5e1; font-size: 13px; font-weight: 600; }
      
      .input, .select {
        width: 100%;
        height: 44px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.03);
        color: var(--text);
        padding: 0 14px;
        outline: none;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .select {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 14px center;
        background-size: 14px;
        padding-right: 40px !important;
        cursor: pointer;
      }
      .select option {
        background: #0f0f1c;
        color: var(--text);
      }
      textarea.input { min-height: 88px; padding-top: 12px; resize: vertical; }
      .input:focus, .select:focus {
        border-color: var(--primary);
        background: rgba(255, 255, 255, 0.05);
        box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.2), 0 4px 12px rgba(129, 140, 248, 0.1);
      }

      /* Checkbox Customization */
      input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        border: 1.5px solid var(--border);
        border-radius: 6px;
        outline: none;
        background: rgba(255, 255, 255, 0.03);
        cursor: pointer;
        display: inline-grid;
        place-content: center;
        transition: all 0.2s ease;
      }
      input[type="checkbox"]:checked {
        background: var(--primary);
        border-color: var(--primary);
        box-shadow: 0 0 8px rgba(129, 140, 248, 0.4);
      }
      input[type="checkbox"]:checked::before {
        content: "";
        width: 8px;
        height: 8px;
        background-color: white;
        clip-path: polygon(14% 44%, 0 58%, 33% 90%, 100% 23%, 86% 9%, 33% 62%);
        transform: scale(1.1);
      }

      .btn {
        min-height: 42px;
        border: 1px solid transparent;
        border-radius: 12px;
        padding: 0 20px;
        background: var(--primary-gradient);
        color: #fff;
        font-weight: 700;
        font-size: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
      }
      .btn:hover:not(:disabled) {
        opacity: 0.95;
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
      }
      .btn:active:not(:disabled) {
        transform: translateY(0);
      }
      .btn.secondary { 
        background: rgba(255, 255, 255, 0.04); 
        border-color: var(--border); 
        color: #cbd5e1;
        box-shadow: none;
      }
      .btn.secondary:hover:not(:disabled) { 
        background: rgba(255, 255, 255, 0.08); 
        border-color: var(--border-hover);
        color: #fff;
        box-shadow: none;
      }
      .btn.danger { 
        background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%); 
        box-shadow: 0 4px 12px rgba(244, 63, 94, 0.25);
      }
      .btn.danger:hover:not(:disabled) { 
        box-shadow: 0 6px 20px rgba(244, 63, 94, 0.4); 
      }
      .btn.success { 
        background: linear-gradient(135deg, #10b981 0%, #059669 100%); 
        color: #fff;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
      }
      .btn.success:hover:not(:disabled) {
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
      }
      .btn.block { width: 100%; margin-top: 26px; }

      .app { min-height: 100vh; }
      
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 20;
        width: 280px;
        background: rgba(11, 11, 20, 0.7);
        border-right: 1px solid var(--border);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        transform: translateX(-100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-head {
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .sidebar-head strong {
        font-size: 16px;
        font-weight: 800;
        background: linear-gradient(135deg, #fff 40%, #c7d2fe 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      
      .nav { padding: 16px; overflow-y: auto; flex: 1; }
      .nav-group { 
        margin: 20px 0 8px; 
        padding: 0 12px; 
        color: #64748b; 
        font-size: 10px; 
        font-weight: 800; 
        letter-spacing: 0.2em; 
        text-transform: uppercase; 
      }
      .nav-btn {
        width: 100%;
        height: 44px;
        border: 1px solid transparent;
        border-radius: 12px;
        background: transparent;
        color: #94a3b8;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 12px;
        text-align: left;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        margin-bottom: 4px;
      }
      .nav-btn.active {
        background: linear-gradient(90deg, rgba(129, 140, 248, 0.14) 0%, rgba(99, 102, 241, 0.03) 100%);
        border: 1px solid rgba(129, 140, 248, 0.22);
        color: #a5b4fc;
        box-shadow: inset 0 0 12px rgba(129, 140, 248, 0.04);
        position: relative;
      }
      .nav-btn.active::before {
        content: '';
        position: absolute;
        left: 0;
        top: 25%;
        height: 50%;
        width: 3px;
        background: var(--primary);
        border-radius: 0 4px 4px 0;
        box-shadow: 0 0 8px var(--primary);
      }
      .nav-btn.active span[style*="background"] {
        background: rgba(129, 140, 248, 0.2) !important;
        color: #fff;
      }
      .nav-btn:hover:not(.active) { 
        background: rgba(255,255,255,0.04); 
        color: #f1f5f9; 
        transform: translateX(2px);
      }

      .main { min-width: 0; }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        min-height: 72px;
        border-bottom: 1px solid var(--border);
        background: rgba(7, 7, 13, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 24px;
      }
      .top-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
      .hamburger { width: 44px; padding: 0; }
      .content { padding: 24px; max-width: 1600px; margin: 0 auto; }

      .notice { 
        margin-bottom: 20px; 
        border-radius: 12px; 
        padding: 14px 18px; 
        border: 1px solid var(--border); 
        font-weight: 500;
        font-size: 14px;
      }
      .notice.success { color: #a7f3d0; background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.2); }
      .notice.error { color: #fecdd3; background: rgba(244, 63, 94, 0.1); border-color: rgba(244, 63, 94, 0.2); }

      .grid { display: grid; gap: 18px; }
      .metrics { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
      .metric-row-1, .metric-row-2 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 18px;
      }
      .chart-row {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
      }
      @media (max-width: 1024px) {
        .metric-row-1, .metric-row-2 {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 640px) {
        .metric-row-1, .metric-row-2, .chart-row {
          grid-template-columns: 1fr;
        }
      }
      
      .metric { 
        padding: 24px; 
        display: flex; 
        align-items: center; 
        gap: 12px;
        border: 1px solid rgba(255, 255, 255, 0.04);
        background: linear-gradient(135deg, #141b2d 0%, #0e1320 100%);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
      }
      .metric:hover {
        transform: translateY(-4px);
        border-color: rgba(124, 92, 255, 0.25);
        box-shadow: 0 15px 35px rgba(124, 92, 255, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }
      .metric::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, rgba(255,255,255,0.08), rgba(255,255,255,0));
      }
      .metric-value { 
        margin-top: 6px; 
        font-family: "Roboto Mono", ui-monospace, monospace; 
        font-size: 28px; 
        font-weight: 800; 
        color: #fff;
      }
      .metric-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, rgba(129, 140, 248, 0.15) 0%, rgba(129, 140, 248, 0.03) 100%);
        border: 1px solid rgba(129, 140, 248, 0.25);
        color: #a5b4fc;
        font-size: 13px;
        font-weight: 800;
        box-shadow: inset 0 0 12px rgba(129, 140, 248, 0.1);
      }

      .chart-container {
        height: 230px;
        display: flex;
        align-items: end;
        gap: 10px;
        background-color: rgba(255, 255, 255, 0.005);
        background-image: 
          linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 100% 40px, 40px 100%;
        border-radius: 12px;
        padding: 18px 14px 14px;
        border: 1px solid rgba(255, 255, 255, 0.04);
        position: relative;
      }

      .chart-bar {
        flex: 1;
        background: var(--primary-gradient);
        border-radius: 6px 6px 0 0;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        opacity: 0.8;
      }
      .chart-bar:hover {
        opacity: 1;
        filter: brightness(1.15);
        box-shadow: 0 0 16px rgba(129, 140, 248, 0.4);
        transform: scaleY(1.02);
      }

      .panel { 
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: 20px;
        box-shadow: var(--card-shadow);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        overflow: hidden; 
        transition: border-color 0.2s ease;
      }
      .panel:hover {
        border-color: rgba(255,255,255,0.1);
      }
      .panel-head { 
        padding: 20px 24px; 
        border-bottom: 1px solid var(--border); 
        display: flex; 
        align-items: center; 
        justify-content: space-between; 
        gap: 12px; 
      }
      .panel-head h3 {
        font-size: 16px;
        font-weight: 800;
        background: linear-gradient(135deg, #fff 60%, #cbd5e1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .panel-body { padding: 18px; }
      .toolbar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }

      .table-wrap { 
        overflow-x: auto; 
        border-radius: 12px; 
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,0.1) transparent;
      }
      table { width: 100%; min-width: 760px; border-collapse: collapse; font-size: 14px; }
      th, td { padding: 16px 18px; border-bottom: 1px solid rgba(255, 255, 255, 0.04); text-align: left; vertical-align: middle; }
      th { 
        color: #64748b; 
        font-size: 11px; 
        letter-spacing: 0.15em; 
        text-transform: uppercase; 
        font-weight: 700; 
        background: rgba(255,255,255,0.01);
      }
      td { color: #e2e8f0; }
      tr:last-child td { border-bottom: none; }
      tr { transition: background 0.2s ease; }
      tr:hover td { background: rgba(255, 255, 255, 0.015); }
      .actions { display: flex; flex-wrap: nowrap; gap: 8px; align-items: center; white-space: nowrap; }

      .btn-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        height: 34px;
        padding: 0 14px;
        border-radius: 8px;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid transparent;
        cursor: pointer;
        text-decoration: none;
        outline: none;
      }
      .btn-action.btn-primary {
        background: var(--primary-gradient);
        color: white;
        box-shadow: 0 2px 8px rgba(99, 102, 241, 0.2);
      }
      .btn-action.btn-primary:hover {
        opacity: 0.95;
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
      }
      .btn-action.btn-outline {
        background: transparent;
        border-color: rgba(255, 255, 255, 0.12);
        color: #cbd5e1;
      }
      .btn-action.btn-outline:hover {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(255, 255, 255, 0.25);
        color: white;
      }
      .btn-action.btn-danger-outline {
        background: transparent;
        border-color: rgba(244, 63, 94, 0.25);
        color: #fda4af;
      }
      .btn-action.btn-danger-outline:hover {
        background: rgba(244, 63, 94, 0.1);
        border-color: #f43f5e;
        color: white;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        border: 1px solid transparent;
      }
      .badge.green { 
        color: #34d399; 
        background: rgba(16, 185, 129, 0.08); 
        border-color: rgba(16, 185, 129, 0.15); 
      }
      .badge.yellow { 
        color: #fbbf24; 
        background: rgba(245, 158, 11, 0.08); 
        border-color: rgba(245, 158, 11, 0.15); 
      }
      .badge.red { 
        color: #f87171; 
        background: rgba(244, 63, 94, 0.08); 
        border-color: rgba(244, 63, 94, 0.15); 
      }

      .form-grid { display: grid; gap: 16px; }
      .two-col { grid-template-columns: 1fr; }
      
      .file-input {
        min-height: 48px;
        border: 1px dashed var(--border);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.02);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #94a3b8;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .file-input:hover {
        border-color: var(--primary);
        background: rgba(129, 140, 248, 0.03);
        color: white;
      }
      .file-input input { display: none; }
      .preview { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px; }
      .preview div { height: 64px; border-radius: 10px; background-size: cover; background-position: center; border: 1px solid var(--border); }

      .empty {
        min-height: 240px;
        display: grid;
        place-items: center;
        text-align: center;
        border: 1px dashed var(--border);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.01);
        padding: 32px;
      }
      .empty-title {
        margin-top: 10px;
        color: #64748b;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .spinner-page, .saving-toast { display: flex; align-items: center; gap: 12px; }
      .spinner {
        width: 24px;
        height: 24px;
        border: 3px solid rgba(129, 140, 248, 0.1);
        border-top-color: var(--primary);
        border-radius: 999px;
        animation: spin 800ms linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .animate-spin { animation: spin 1s linear infinite; }

      .spinner-page { 
        min-height: 280px; 
        justify-content: center; 
        border: 1px solid var(--border); 
        border-radius: 16px; 
        background: rgba(255,255,255,0.02); 
      }
      .saving-toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 50;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: #0f0f1c;
        padding: 14px 18px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        font-weight: 600;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(7, 7, 13, 0.8);
        backdrop-filter: blur(8px);
        padding: 16px;
      }
      .modal { 
        width: 100%; 
        max-width: 440px; 
        padding: 24px; 
        background: #0f0f1d; 
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 30px 70px rgba(0,0,0,0.6);
      }
